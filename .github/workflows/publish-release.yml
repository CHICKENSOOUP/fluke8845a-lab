name: Publish source packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  test-python311:
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock-python311.txt

      - name: Install locked Python 3.11 test environment
        run: |
          python -m pip install --disable-pip-version-check -r requirements-lock-python311.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
        shell: pwsh

      - name: Run Python 3.11 tests (60-second limit)
        run: |
          New-Item -ItemType Directory -Path "build" -Force | Out-Null
          python -m pytest -p no:cacheprovider --maxfail=1 --basetemp "build\pytest-release-py311"
        shell: pwsh
        timeout-minutes: 1

  publish:
    needs: test-python311
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked test environment
        run: |
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
        shell: pwsh

      - name: Run tests (60-second limit)
        run: |
          New-Item -ItemType Directory -Path "build" -Force | Out-Null
          python -m pytest -p no:cacheprovider --maxfail=1 --basetemp "build\pytest-release"
        shell: pwsh
        timeout-minutes: 1

      - name: Build and verify source package
        run: |
          python scripts/package_source.py --output dist/Fluke8845A_Source_Project.zip
          $archive = Join-Path $env:GITHUB_WORKSPACE "dist\Fluke8845A_Source_Project.zip"
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Fluke8845A_Source_Project.zip" | Set-Content -LiteralPath "dist\SHA256SUMS.txt" -Encoding ascii
        shell: pwsh

      - name: Smoke test first launch from extracted source ZIP (60-second limit)
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE "dist\Fluke8845A_Source_Project.zip"
          $extractRoot = Join-Path $env:RUNNER_TEMP ("Fluke8845A_source_smoke_" + [guid]::NewGuid().ToString("N"))
          Expand-Archive -Path $archive -DestinationPath $extractRoot
          Push-Location $extractRoot
          try {
            $env:QT_QPA_PLATFORM = "offscreen"
            python "scripts\launch_windows.py" desktop --mock --smoke
            if ($LASTEXITCODE -ne 0) { throw "Extracted source ZIP first-launch smoke failed (exit $LASTEXITCODE)." }
          }
          finally {
            Pop-Location
          }
        shell: pwsh
        timeout-minutes: 1

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.2.2

      - name: Publish source package to GitHub Packages (GHCR)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repoPath = $env:GITHUB_REPOSITORY.ToLowerInvariant()
          $package = "ghcr.io/$repoPath-source"

          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $packageTag = $env:GITHUB_REF_NAME.ToLowerInvariant()
          } else {
            $packageTag = "main-build-$($env:GITHUB_SHA.Substring(0, 12))"
          }

          $packageReference = "${package}:$packageTag"
          $env:GHCR_TOKEN | oras login ghcr.io --username $env:GITHUB_ACTOR --password-stdin
          if ($LASTEXITCODE -ne 0) { throw "GHCR login failed (exit $LASTEXITCODE)." }

          $orasArguments = @(
            "push",
            "--artifact-type", "application/vnd.fluke8845a.source-bundle.v1",
            "--annotation", "org.opencontainers.image.source=https://github.com/$env:GITHUB_REPOSITORY",
            "--annotation", "org.opencontainers.image.description=Fluke 8845A source ZIP and SHA-256 checksum",
            $packageReference,
            "dist/Fluke8845A_Source_Project.zip:application/zip",
            "dist/SHA256SUMS.txt:text/plain"
          )
          & oras @orasArguments
          if ($LASTEXITCODE -ne 0) { throw "GHCR package publication failed (exit $LASTEXITCODE)." }

          Write-Host "Published OCI source package $packageReference"
        shell: pwsh

      - name: Publish commit-specific GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $archive = Join-Path $env:GITHUB_WORKSPACE "dist\Fluke8845A_Source_Project.zip"
          $checksums = Join-Path $env:GITHUB_WORKSPACE "dist\SHA256SUMS.txt"
          $sha = $env:GITHUB_SHA

          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
            $title = "Fluke 8845A Lab $tag"
            $prerelease = $false
          } else {
            $tag = "main-build-$($sha.Substring(0, 12))"
            $title = "Fluke 8845A Lab main build $($sha.Substring(0, 7))"
            $prerelease = $true
          }

          $notes = @"
          Automated source-only package for commit $sha.

          Assets: Fluke8845A_Source_Project.zip and SHA256SUMS.txt.
          The test step is capped at 60 seconds. This release does not claim validation on a real Fluke 8845A.
          A Windows binary is omitted while the documented Qt/PySide licensing review remains open.
          "@

          gh release view $tag --repo $repo *> $null
          $exists = $LASTEXITCODE -eq 0
          if ($exists) {
            gh release upload $tag $archive $checksums --repo $repo --clobber
          } else {
            $ghArguments = @("release", "create", $tag, $archive, $checksums, "--repo", $repo, "--title", $title, "--notes", $notes, "--target", $sha)
            if ($prerelease) { $ghArguments += "--prerelease" } else { $ghArguments += "--verify-tag" }
            gh @ghArguments
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publication failed (exit $LASTEXITCODE)." }
        shell: pwsh
