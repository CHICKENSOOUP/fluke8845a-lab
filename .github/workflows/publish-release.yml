name: Publish source packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to publish"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  test-python311:
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock-python311.txt

      - name: Install locked Python 3.11 test environment
        run: |
          python -m pip install --disable-pip-version-check -r requirements-lock-python311.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
        shell: pwsh

      - name: Run Python 3.11 tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          New-Item -ItemType Directory -Path "build" -Force | Out-Null
          python scripts/run_tests_sharded.py --output-root "build\pytest-shards-py311" --timeout-seconds 480
          if ($LASTEXITCODE -ne 0) { throw "Python 3.11 pytest shard suite failed (exit $LASTEXITCODE)." }
        shell: pwsh

      - name: Upload Python 3.11 test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-shards-py311
          path: build/pytest-shards-py311/**/stdout.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: test-python311
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Node.js for Web frontend tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Validate versioned release identity
        env:
          RECOVERY_TAG: ${{ inputs.release_tag }}
        run: |
          $refType = $env:GITHUB_REF_TYPE
          $refName = $env:GITHUB_REF_NAME
          $sha = (git rev-parse HEAD).Trim()
          if ($env:RECOVERY_TAG) {
            $refType = "tag"
            $refName = $env:RECOVERY_TAG
            $tagSha = (git rev-parse "refs/tags/$refName^{commit}").Trim()
            if ($LASTEXITCODE -ne 0 -or $tagSha -ne $sha) { throw "Checked out commit does not match the requested tag." }
          }
          python scripts/release_metadata.py --ref-type $refType --ref-name $refName --sha $sha
          if ($LASTEXITCODE -ne 0) { throw "Invalid release identity." }
        shell: pwsh

      - name: Install locked test environment
        run: |
          python -m pip install --disable-pip-version-check -r requirements-lock.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
        shell: pwsh

      - name: Run Web frontend JavaScript tests
        env:
          PYTHON: python
        run: python scripts/run_web_tests.py
        shell: pwsh

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          New-Item -ItemType Directory -Path "build" -Force | Out-Null
          python scripts/run_tests_sharded.py --output-root "build\pytest-shards-py312" --timeout-seconds 480
          if ($LASTEXITCODE -ne 0) { throw "Python 3.12 pytest shard suite failed (exit $LASTEXITCODE)." }
        shell: pwsh

      - name: Upload Python 3.12 test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pytest-shards-py312
          path: build/pytest-shards-py312/**/stdout.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build and verify source package
        run: |
          New-Item -ItemType Directory -Path "build" -Force | Out-Null
          python scripts/build_provenance.py source --root . --candidate-build-name Fluke8845A --output build/BUILD-PROVENANCE.json
          if ($LASTEXITCODE -ne 0) { throw "Source provenance generation failed (exit $LASTEXITCODE)." }
          python scripts/package_source.py --output dist/Fluke8845A_Source_Project.zip --provenance build/BUILD-PROVENANCE.json
          if ($LASTEXITCODE -ne 0) { throw "Source package creation failed (exit $LASTEXITCODE)." }
          $archive = Join-Path $env:GITHUB_WORKSPACE "dist\Fluke8845A_Source_Project.zip"
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Fluke8845A_Source_Project.zip" | Set-Content -LiteralPath "dist\SHA256SUMS.txt" -Encoding ascii
        shell: pwsh

      - name: Smoke test first launch from extracted source ZIP
        run: |
          $archive = Join-Path $env:GITHUB_WORKSPACE "dist\Fluke8845A_Source_Project.zip"
          $extractRoot = Join-Path $env:RUNNER_TEMP ("Fluke8845A_source_smoke_" + [guid]::NewGuid().ToString("N"))
          Expand-Archive -Path $archive -DestinationPath $extractRoot
          Push-Location $extractRoot
          try {
            $env:QT_QPA_PLATFORM = "offscreen"
            python "scripts\launch_windows.py" desktop --mock --smoke
            if ($LASTEXITCODE -ne 0) { throw "Extracted source ZIP first-launch smoke failed (exit $LASTEXITCODE)." }
            python "$env:GITHUB_WORKSPACE\scripts\package_source.py" --smoke-extracted-source-web "$extractRoot" --timeout-seconds 20
            if ($LASTEXITCODE -ne 0) { throw "Extracted source ZIP Web smoke failed (exit $LASTEXITCODE)." }
          }
          finally {
            Pop-Location
          }
        shell: pwsh

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.2.2

      - name: Publish and verify matching Release and GHCR package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_TAG: ${{ inputs.release_tag }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $archive = Join-Path $env:GITHUB_WORKSPACE "dist\Fluke8845A_Source_Project.zip"
          $checksums = Join-Path $env:GITHUB_WORKSPACE "dist\SHA256SUMS.txt"
          $manifestPath = Join-Path $env:RUNNER_TEMP ("ghcr-manifest-" + [guid]::NewGuid().ToString("N") + ".json")
          $releasePath = Join-Path $env:RUNNER_TEMP ("github-release-" + [guid]::NewGuid().ToString("N") + ".json")
          $sha = (git rev-parse HEAD).Trim()
          $refType = $env:GITHUB_REF_TYPE
          $refName = $env:GITHUB_REF_NAME
          if ($env:RECOVERY_TAG) {
            $refType = "tag"
            $refName = $env:RECOVERY_TAG
            $tagSha = (git rev-parse "refs/tags/$refName^{commit}").Trim()
            if ($LASTEXITCODE -ne 0 -or $tagSha -ne $sha) { throw "Checked out commit does not match the requested tag." }
          }
          $metadata = (python scripts/release_metadata.py --ref-type $refType --ref-name $refName --sha $sha | ConvertFrom-Json)
          $tag = $metadata.tag
          $title = $metadata.title
          $prerelease = [bool]$metadata.prerelease
          $releaseNotesPath = Join-Path $env:GITHUB_WORKSPACE ("docs\release-notes-v$($metadata.version).md")
          if (-not (Test-Path -LiteralPath $releaseNotesPath -PathType Leaf)) {
            throw "Versioned release notes are missing: $releaseNotesPath"
          }
          $releaseNotes = (Get-Content -LiteralPath $releaseNotesPath -Raw).Trim()

          $notes = @"
          $releaseNotes

          ---

          Source commit: $sha.
          Assets: Fluke8845A_Source_Project.zip and SHA256SUMS.txt.
          "@

          $viewOutput = & gh release view $tag --repo $repo --json tagName,isDraft,isPrerelease,assets 2>&1
          $viewExitCode = $LASTEXITCODE
          $wasDraft = $false
          if ($viewExitCode -eq 0) {
            try { $existingRelease = ($viewOutput -join "`n") | ConvertFrom-Json -ErrorAction Stop }
            catch { throw "GitHub Release lookup returned invalid JSON: $($viewOutput -join "`n")" }
            if ($existingRelease.tagName -ne $tag) { throw "GitHub Release lookup returned a different tag." }
            $wasDraft = [bool]$existingRelease.isDraft
            & gh release upload $tag $archive $checksums --repo $repo --clobber
            $uploadExitCode = $LASTEXITCODE
            if ($uploadExitCode -ne 0) { throw "GitHub Release asset upload failed (exit $uploadExitCode)." }
            $editArguments = @("release", "edit", $tag, "--repo", $repo, "--title", $title, "--notes", $notes)
            if ($prerelease) { $editArguments += "--prerelease" }
            & gh @editArguments
            $editExitCode = $LASTEXITCODE
            if ($editExitCode -ne 0) { throw "GitHub Release metadata update failed (exit $editExitCode)." }
            if (-not $wasDraft) {
              Write-Host "The versioned GitHub Release already exists; refreshing it before package verification."
            }
          } elseif (($viewOutput -join "`n") -match "(?i)(HTTP\s*404|\b404\b|not found)" ) {
            # Creating the draft first proves contents:write before the public GHCR tag is changed.
            $ghArguments = @("release", "create", $tag, $archive, $checksums, "--repo", $repo, "--title", $title, "--notes", $notes, "--target", $sha, "--draft")
            if ($prerelease) { $ghArguments += "--prerelease" } else { $ghArguments += "--verify-tag" }
            & gh @ghArguments
            $createExitCode = $LASTEXITCODE
            if ($createExitCode -ne 0) { throw "GitHub draft Release creation failed before GHCR publish (exit $createExitCode)." }
            $wasDraft = $true
          } else {
            throw "GitHub Release lookup failed (exit $viewExitCode); refusing to publish GHCR without a verified Release identity. $($viewOutput -join "`n")"
          }

          $repoPath = $env:GITHUB_REPOSITORY.ToLowerInvariant()
          $package = "ghcr.io/$repoPath-source"
          $packageReference = "${package}:$($metadata.tag.ToLowerInvariant())"
          $env:GHCR_TOKEN | oras login ghcr.io --username $env:GITHUB_ACTOR --password-stdin
          $loginExitCode = $LASTEXITCODE
          if ($loginExitCode -ne 0) { throw "GHCR login failed (exit $loginExitCode)." }

          $orasArguments = @(
            "push",
            # Inputs are fixed files inside the checked-out workspace; ORAS otherwise rejects Windows absolute paths.
            "--disable-path-validation",
            "--artifact-type", "application/vnd.fluke8845a.source-bundle.v1",
            "--annotation", "org.opencontainers.image.source=https://github.com/$env:GITHUB_REPOSITORY",
            "--annotation", "org.opencontainers.image.description=Fluke 8845A source ZIP and SHA-256 checksum",
            $packageReference,
            "${archive}:application/zip",
            "${checksums}:text/plain"
          )
          & oras @orasArguments
          $pushExitCode = $LASTEXITCODE
          if ($pushExitCode -ne 0) { throw "GHCR package publication failed (exit $pushExitCode); the GitHub Release remains a draft if newly created." }

          $manifestJson = & oras manifest fetch $packageReference --format json
          $manifestExitCode = $LASTEXITCODE
          if ($manifestExitCode -ne 0) { throw "GHCR tag fetch failed for $packageReference (exit $manifestExitCode)." }
          $manifestJson | Set-Content -LiteralPath $manifestPath -Encoding utf8
          & python scripts/release_publication.py package --json $manifestPath --archive $archive --checksums $checksums
          if ($LASTEXITCODE -ne 0) { throw "GHCR package contents do not match the source ZIP and checksum." }

          if ($wasDraft) {
            & gh release edit $tag --repo $repo --draft=false
            $publishExitCode = $LASTEXITCODE
            if ($publishExitCode -ne 0) { throw "GitHub draft Release publication failed after GHCR verification (exit $publishExitCode)." }
          }

          $finalReleaseJson = & gh release view $tag --repo $repo --json tagName,isDraft,isPrerelease,assets
          $finalViewExitCode = $LASTEXITCODE
          if ($finalViewExitCode -ne 0) { throw "Final GitHub Release verification failed for $tag (exit $finalViewExitCode)." }
          $finalReleaseJson | Set-Content -LiteralPath $releasePath -Encoding utf8
          $expectedChannel = if ($prerelease) { "true" } else { "false" }
          & python scripts/release_publication.py release --json $releasePath --tag $tag --prerelease $expectedChannel --archive $archive --checksums $checksums
          if ($LASTEXITCODE -ne 0) { throw "Final Release assets/status do not match the validated GHCR package." }

          Write-Host "Verified matching GitHub Release and GHCR package: $tag"
        shell: pwsh
