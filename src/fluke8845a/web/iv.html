<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IV 曲线 · Fluke 8845A</title><link rel="stylesheet" href="/iv.css"><script defer src="/iv_math.js"></script><script defer src="/iv.js"></script></head>
<body><header><strong>8845A <span>IV 测量</span></strong><span id="status" role="status">未连接</span><div class="actions"><button id="new">新建测量</button><button id="open">打开</button><button id="save">保存 JSON</button><button id="csv">导出 CSV</button></div><input id="file" type="file" accept=".json,application/json" hidden></header>
<main><div class="left"><section class="settings"><h2>测量设置</h2><div class="form-grid"><label>电压 (V)<input id="voltage" type="number" step="any" value="0"></label><button id="confirmVoltage">确认电压</button><span id="voltageStatus">未确认</span></div><fieldset id="locked"><div class="form-grid"><label>串口<input id="port" value="COM3"></label><label>波特率<select id="baud"><option>1200</option><option>2400</option><option>4800</option><option selected>9600</option><option>19200</option><option>38400</option><option>57600</option><option>115200</option><option>230400</option></select></label><label>NPLC<select id="nplc"><option>0.02</option><option>0.2</option><option selected>1</option><option>10</option><option>100</option></select></label><label>采样间隔 (秒)<input id="interval" type="number" min="0" max="86400" step="any" value="1"></label><label>电流量程<select id="range"><option value="auto">自动</option><option value="0.0001">100 µA</option><option value="0.001">1 mA</option><option value="0.01">10 mA</option><option value="0.1">100 mA</option><option value="0.4">400 mA</option><option value="1">1 A</option><option value="3">3 A</option><option value="10">10 A</option></select></label><label>保存目录<input id="root"></label></div><details><summary>高级串口参数</summary><div class="form-grid"><label>数据位<select id="bytesize"><option>7</option><option selected>8</option></select></label><label>校验<select id="parity"><option value="N">无</option><option value="E">偶</option><option value="O">奇</option></select></label><label>停止位<select id="stopbits"><option>1</option><option>2</option></select></label><label>结束符<select id="eol"><option>CR</option><option>LF</option><option selected>CRLF</option></select></label><label>流控制<select id="flow"><option value="none">无</option><option value="xonxoff">XON/XOFF</option><option value="rtscts">RTS/CTS</option></select></label><label>超时 (秒)<input id="timeout" type="number" min="0.1" max="5" step="0.1" value="2"></label></div></details><div class="row"><button id="scan">扫描串口</button><select id="ports" aria-label="扫描结果"><option value="">选择串口</option></select><button id="connect">连接仪器</button><button id="mock">连接模拟器</button><button id="disconnect">断开</button></div><label class="check"><input id="safety" type="checkbox">已核对电流端子、量程及接线</label></fieldset><div class="row"><button class="primary" id="start">开始测量</button><button id="stop">停止</button><button class="primary" id="capture">记录 IV 点</button></div></section>
<section class="chart"><div class="section-head"><h2>电流—时间</h2><label>窗口 (秒)<input id="window" type="number" min="0.001" step="any" value="60"></label></div><div class="row axis"><label>纵轴<select id="axis"><option value="auto">自动</option><option value="manual">手动</option></select></label><label>最小 (A)<input id="ymin" type="number" step="any"></label><label>最大 (A)<input id="ymax" type="number" step="any"></label><button id="applyAxis">应用</button></div><canvas id="it" aria-label="电流时间曲线，Ctrl 加鼠标滚轮缩放纵轴，双击恢复自动"></canvas><div class="stats"><div>平均值<strong id="mean">—</strong></div><div>方差<strong id="variance">—</strong></div><div>标准差<strong id="std">—</strong></div><div>中位数<strong id="median">—</strong></div></div><div id="windowStatus" role="status">等待数据</div></section></div>
<section class="chart iv"><div class="section-head"><h2>IV 曲线</h2><label>电流轴<select id="scale"><option value="linear">线性</option><option value="log">带符号对数</option></select></label></div><canvas id="iv" aria-label="IV 曲线"></canvas><div class="table-wrap"><table><thead><tr><th>电压 (V)</th><th>电流 (A)</th><th>操作</th></tr></thead><tbody id="points"></tbody></table></div></section></main></body></html>
